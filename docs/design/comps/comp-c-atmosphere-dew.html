<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Historical Comp · Atmosphere Dew Glass</title>
<style>
  html,body{margin:0;height:100%;font-family:"Noto Sans SC",system-ui,sans-serif;}
  *{box-sizing:border-box;}
  .historical-banner{position:fixed;z-index:9999;inset:0 0 auto 0;padding:10px 16px;background:#8b1d1d;color:#fff;font:700 13px/1.35 system-ui,sans-serif;text-align:center;letter-spacing:.03em;box-shadow:0 2px 12px #0006;}
  .frame{position:relative;width:min(1200px,100vw);aspect-ratio:16/9;margin:0 auto;overflow:hidden;}
  .dots{position:absolute;right:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;}
  .dot{width:6px;height:6px;border-radius:50%;border:1px solid currentColor;opacity:.45;}
  .dot.on{opacity:1;background:currentColor;}
  
  .frame{background:
    radial-gradient(120% 80% at 70% 20%, oklch(0.35 0.06 230 / 0.45), transparent 55%),
    radial-gradient(90% 70% at 20% 80%, oklch(0.4 0.05 40 / 0.25), transparent 50%),
    oklch(0.12 0.03 250);
    color:oklch(0.96 0.01 240);}
  .clock{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;}
  .time{font-weight:200;font-size:clamp(64px,12vw,120px);letter-spacing:-0.03em;line-height:0.95;
    text-shadow:0 0 40px oklch(0.85 0.06 40 / 0.25);}
  .date{margin-top:12px;font-size:15px;color:oklch(0.78 0.03 230);letter-spacing:0.08em;}
  .glass{position:absolute;left:8%;bottom:10%;width:22%;padding:16px 18px;
    background:oklch(0.22 0.04 240 / 0.4);border:1px solid oklch(0.9 0.02 240 / 0.18);
    border-radius:14px;backdrop-filter:blur(18px);font-size:13px;}
  .dots{color:oklch(0.78 0.08 200)}

</style>
</head>
<body>
<aside class="historical-banner">HISTORICAL / SUPERSEDED · 仅供历史查阅 · 当前权威：DESIGN.md v0.2 Liquid Glass · 此刻 / 灵感 / 流光</aside>
<div class="frame">

  <div class="clock"><div class="time">21:48</div><div class="date">7月23日 星期四</div></div>
  <div class="glass">沉浸光雾 · 示例玻璃层</div>
  <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot on"></span></div>

</div>
</body>
</html>
