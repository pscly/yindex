name: Release extension zip

# HUMAN GATE: creating/pushing a tag and publishing its GitHub Release all
# require explicit confirmation. This workflow never creates or pushes tags;
# only an already-confirmed tag push may publish a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label (optional)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install

      - name: Verify and pack
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="$(python3 -c "import json; print(json.load(open('package.json'))['version'])")"
          fi
          bun run verify "$VERSION"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yindex-extension
          path: release/yindex-extension-*.zip

      # Publication remains tag-driven and requires the human gate above.
      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/yindex-extension-*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
